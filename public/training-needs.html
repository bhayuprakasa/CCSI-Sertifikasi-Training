<!DOCTYPE html>
<html lang="id">
<head>
<script src="/js/api-client.js"></script>
<script src="/js/searchable-select.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Form Kebutuhan Pelatihan — CCSI</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a3c6e;--navy-dk:#12294d;--navy-lt:#2a5298;
  --accent:#e8a020;--accent-lt:#fef3dc;
  --red:#d63031;--red-lt:#ffeaea;
  --green:#00a86b;--green-lt:#e6f7f1;
  --yellow:#f39c12;--yellow-lt:#fff8e6;
  --purple:#6c3483;--purple-lt:#f4ecf7;
  --bg:#f0f3f8;--surface:#fff;--border:#dde3ec;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --font:'Segoe UI',system-ui,Arial,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--navy);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.header-left{display:flex;align-items:center;gap:12px}
.logo-box{width:34px;height:34px;background:var(--accent);border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--navy-dk)}
.header-title{font-size:.95rem;font-weight:700;line-height:1.2}
.header-sub{font-size:.68rem;opacity:.7}
.page{max-width:900px;margin:0 auto;padding:20px 16px}
.card{background:var(--surface);border-radius:10px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title{font-size:.88rem;font-weight:700;color:var(--navy)}
.card-body{padding:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.three{grid-template-columns:1fr 1fr 1fr}
.form-grid .full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.76rem;font-weight:600;color:var(--text2)}
.form-group input,.form-group select,.form-group textarea{padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:.83rem;font-family:var(--font);color:var(--text);outline:none;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--navy-lt)}
.form-group textarea{resize:vertical;min-height:58px}
.btn-cancel{padding:7px 16px;border-radius:7px;border:1px solid var(--border);background:#f8fafd;color:var(--text2);cursor:pointer;font-family:var(--font);font-size:.83rem}
select.filter{padding:7px 11px;border:1px solid var(--border);border-radius:7px;font-size:.83rem;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;cursor:pointer}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.81rem}
thead th{background:#f8fafd;color:var(--text2);font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid #f0f3f6;transition:background .1s}
tbody tr:hover{background:#f8fafd}
tbody td{padding:10px 12px;vertical-align:middle}
.empty-row td{text-align:center;color:var(--text3);padding:28px;font-size:.83rem}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.7rem;font-weight:600;white-space:nowrap}
.b-green{background:var(--green-lt);color:#007a50}.b-red{background:var(--red-lt);color:var(--red)}
.b-yellow{background:var(--yellow-lt);color:#b7760a}.b-navy{background:#e8eef7;color:var(--navy)}
.b-gray{background:#f1f5f9;color:var(--text2)}.b-purple{background:var(--purple-lt);color:var(--purple)}
.btn-sm{padding:3px 9px;border-radius:5px;font-size:.73rem;cursor:pointer;border:1px solid;font-family:var(--font);font-weight:500;transition:all .12s}
.btn-edit{color:var(--navy);border-color:var(--border);background:#f8fafd}
.btn-del{color:var(--red);border-color:#fcd4d4;background:var(--red-lt)}
.btn-del:hover{background:#ffc5c5}
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:8px;font-size:.83rem;z-index:999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.tn-entry{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px;position:relative}
.tn-entry-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tn-entry-num{font-size:.82rem;font-weight:700;color:var(--navy);background:#e8eef7;padding:3px 12px;border-radius:20px}
.tn-remove{background:var(--red-lt);border:1px solid #fcd4d4;color:var(--red);border-radius:6px;padding:4px 10px;font-size:.75rem;cursor:pointer;font-family:var(--font);font-weight:500}
.tn-remove:hover{background:#ffc5c5}
.tn-peserta-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.tn-peserta-row select{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:.83rem;font-family:var(--font);color:var(--text);outline:none}
.tn-peserta-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;padding:0 4px;line-height:1}
.tn-add-peserta{background:none;border:1px dashed var(--navy-lt);color:var(--navy-lt);border-radius:6px;padding:5px 12px;font-size:.78rem;cursor:pointer;font-family:var(--font);margin-top:4px;transition:all .15s}
.tn-add-peserta:hover{background:rgba(42,82,152,.06)}
.tn-add-entry{width:100%;padding:12px;border:2px dashed var(--border);border-radius:10px;background:transparent;color:var(--navy-lt);font-size:.88rem;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;margin-bottom:16px}
.tn-add-entry:hover{border-color:var(--navy-lt);background:rgba(42,82,152,.04)}
.tn-submit{padding:10px 28px;border-radius:8px;border:none;background:var(--navy);color:#fff;cursor:pointer;font-family:var(--font);font-size:.88rem;font-weight:700;transition:background .15s}
.tn-submit:hover{background:var(--navy-dk)}
.tn-submit:disabled{opacity:.5;cursor:not-allowed}
.tn-score-section{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.tn-score-section h4{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:8px}
.tn-score-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-bottom:8px}
.tn-score-table th,.tn-score-table td{border:1px solid var(--border);padding:6px 10px;text-align:center}
.tn-score-table th{background:#f8fafd;color:var(--text2);font-size:.72rem;font-weight:600;text-transform:uppercase}
.tn-score-table td:first-child{text-align:left;font-weight:500}
.tn-score-table input[type="number"]{width:50px;text-align:center;padding:4px;border:1px solid var(--border);border-radius:4px;font-size:.8rem;font-family:var(--font)}
.tn-score-table tr.score-total td{font-weight:700;background:#f8fafd}
.tn-score-legend{font-size:.72rem;color:var(--text3);line-height:1.6;margin-top:4px}
.tn-score-legend span{margin-right:12px}
.tn-gt-result{margin-top:6px;font-size:.82rem;font-weight:600}
.tn-gt-result.accepted{color:var(--green)}
.tn-gt-result.refused{color:var(--red)}
.dept-header-box{background:var(--accent-lt);border:1px solid #f0d080;border-radius:8px;padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:.85rem;color:#92610a}
.dept-header-box strong{color:var(--navy-dk)}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.form-grid.three{grid-template-columns:1fr}.header{padding:0 12px}}
@media print{.header,.btn-sm,.tn-submit,.tn-add-entry,.tn-add-peserta,.tn-remove,.tn-peserta-remove,.btn-cancel{display:none!important}.card{box-shadow:none;border:1px solid #ccc}body{background:#fff}}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-box">CCSI</div>
    <div>
      <div class="header-title">Form Kebutuhan Pelatihan</div>
      <div class="header-sub">PT Communication Cable Systems Indonesia</div>
    </div>
  </div>
</div>

<div class="page">
  <div class="card">
    <div class="card-header">
      <span class="card-title">📝 Form Kebutuhan Pelatihan Tahunan</span>
      <span style="font-size:.78rem;color:var(--text3)">Diisi oleh Department Head di awal tahun</span>
    </div>
    <div class="card-body">
      <!-- Header: Dept (moved here), Year, Submitter -->
      <div class="form-grid three" style="margin-bottom:16px">
        <div class="form-group">
          <label>Departemen *</label>
          <select id="tn_dept_header" onchange="onDeptChange()" data-searchable>
            <option value="">-- Pilih Departemen --</option>
            <option>HR &amp; GA</option>
            <option>Finance</option>
            <option>IT</option>
            <option>Produksi</option>
            <option>QC/QA</option>
            <option>Engineering</option>
            <option>Purchasing</option>
            <option>PPIC</option>
            <option>Maintenance</option>
            <option>Warehouse</option>
            <option>Sales</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tahun Perencanaan *</label>
          <select id="tn_year" style="width:100%" data-searchable></select>
        </div>
        <div class="form-group">
          <label>Diajukan oleh</label>
          <input type="text" id="tn_submitter" placeholder="Nama Dept Head" style="width:100%">
        </div>
      </div>

      <div id="tnEntries"></div>
      <button class="tn-add-entry" onclick="tnAddEntry()">+ Tambah Kebutuhan Pelatihan</button>
      <div style="display:flex;justify-content:flex-end;gap:10px">
        <button class="btn-cancel" onclick="tnReset()">Reset Form</button>
        <button class="tn-submit" id="tnSubmitBtn" onclick="tnSubmit()">📤 Kirim Semua</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let tnCounter = 0;
let allEmployees = [];

async function api(path, opts) {
  const res = await fetch(API + path, { headers: {'Content-Type':'application/json'}, ...opts });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

function showToast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = ok ? '#1e293b' : 'var(--red)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800);
}

const fmtRp = n => (!n || n == 0) ? '-' : 'Rp ' + Number(n).toLocaleString('id-ID');

function buildPesertaOptions(dept) {
  const filtered = dept ? allEmployees.filter(e => e.department === dept && e.is_active) : [];
  if (!filtered.length) return '<option value="">-- Pilih peserta --</option>';
  return '<option value="">-- Pilih peserta --</option>' +
    filtered.map(e => `<option value="${e.employee_id}">${e.full_name} (${e.position || e.employee_id})</option>`).join('');
}

function onDeptChange() {
  const dept = document.getElementById('tn_dept_header').value;
  // Refresh all existing peserta selects
  document.querySelectorAll('.tn-peserta-select').forEach(sel => {
    const cur = sel.value;
    sel.innerHTML = buildPesertaOptions(dept);
    if (cur) sel.value = cur;
  });
}

async function initPage() {
  const yearSel = document.getElementById('tn_year');
  const cur = new Date().getFullYear();
  for (let y = cur; y <= cur + 2; y++) yearSel.innerHTML += `<option value="${y}" ${y===cur+1?'selected':''}>${y}</option>`;

  try {
    allEmployees = await api('/api/employees');
  } catch (e) {
    console.warn('Gagal load karyawan:', e.message);
    allEmployees = [];
  }

  tnAddEntry();
}

function tnAddEntry() {
  tnCounter++;
  const idx = tnCounter;
  const dept = document.getElementById('tn_dept_header').value;
  const div = document.createElement('div');
  div.className = 'tn-entry';
  div.id = `tn-entry-${idx}`;
  div.innerHTML = `
    <div class="tn-entry-header">
      <span class="tn-entry-num">Kebutuhan #${idx}</span>
      <button class="tn-remove" onclick="tnRemoveEntry(${idx})">✕ Hapus</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Tipe *</label>
        <select id="tn_type_${idx}">
          <option value="">-- Pilih Tipe --</option>
          <option value="Training">Training</option>
          <option value="Sertifikasi">Sertifikasi</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nama Pelatihan *</label>
        <input type="text" id="tn_name_${idx}" placeholder="Nama program pelatihan">
      </div>
      <div class="form-group">
        <label>Penyelenggara *</label>
        <select id="tn_org_${idx}">
          <option value="">-- Pilih --</option>
          <option value="Internal">Internal</option>
          <option value="Eksternal">Eksternal</option>
        </select>
      </div>
      <div class="form-group">
        <label>Target Pelaksanaan *</label>
        <input type="month" id="tn_target_${idx}">
      </div>
      <div class="form-group full">
        <label>Estimasi Biaya (Rp) *</label>
        <input type="text" id="tn_cost_${idx}" placeholder="0" oninput="tnFormatCost(this)">
      </div>
      <div class="form-group full">
        <label>Nama Peserta *</label>
        <div id="tn_peserta_${idx}">
          <div class="tn-peserta-row">
            <select class="tn-peserta-select">${buildPesertaOptions(dept)}</select>
          </div>
        </div>
        <button class="tn-add-peserta" onclick="tnAddPeserta(${idx})">+ Tambah Peserta</button>
      </div>
    </div>
    <div class="tn-score-section">
      <h4>Kriteria Penilaian (Proposed Criteria / Score)</h4>
      <table class="tn-score-table">
        <thead>
          <tr><th rowspan="2">Kriteria Penilaian</th><th colspan="2">Peserta</th><th colspan="2">Materi</th></tr>
          <tr><th>Atasan</th><th>HRD</th><th>Atasan</th><th>HRD</th></tr>
        </thead>
        <tbody>
          <tr><td>Tuntutan Jabatan</td>
            <td><input type="number" min="1" max="4" class="sc-pa" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-ph" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-ma" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-mh" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td></tr>
          <tr><td>Sasaran perusahaan/Dept.</td>
            <td><input type="number" min="1" max="4" class="sc-pa" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-ph" data-idx="${idx}" oninput="clampScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-ma" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-mh" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td></tr>
          <tr><td>Masa kerja/senioritas</td>
            <td><input type="number" min="1" max="4" class="sc-pa" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-ph" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-ma" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-mh" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td></tr>
          <tr><td>Kepemimpinan</td>
            <td><input type="number" min="1" max="4" class="sc-pa" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-ph" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-ma" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td>
            <td><input type="number" min="1" max="4" class="sc-mh" data-idx="${idx}" oninput="clampScore(this);tnCalcScore(${idx})"></td></tr>
          <tr class="score-total"><td>Total Nilai</td>
            <td id="sc_pa_total_${idx}">0</td><td id="sc_ph_total_${idx}">0</td>
            <td id="sc_ma_total_${idx}">0</td><td id="sc_mh_total_${idx}">0</td></tr>
          <tr class="score-total"><td>Grand Total (GT)</td>
            <td colspan="4" id="sc_gt_${idx}">0</td></tr>
        </tbody>
      </table>
      <div class="tn-score-legend">
        <span>1 = tidak penting</span>
        <span>2 = dipertimbangkan</span>
        <span>3 = penting</span>
        <span>4 = sangat penting</span>
      </div>
      <div class="tn-score-legend" style="margin-top:2px">
        <span>GT &ge; 32 &rarr; <strong style="color:var(--green)">Diterima</strong></span>
        <span>GT &lt; 32 &rarr; <strong style="color:var(--red)">Ditolak</strong></span>
      </div>
      <div class="tn-gt-result" id="sc_gt_status_${idx}"></div>
    </div>
  `;
  document.getElementById('tnEntries').appendChild(div);
}

function tnRemoveEntry(idx) {
  const el = document.getElementById(`tn-entry-${idx}`);
  if (el) el.remove();
  if (!document.getElementById('tnEntries').children.length) tnAddEntry();
}

function tnAddPeserta(idx) {
  const container = document.getElementById(`tn_peserta_${idx}`);
  const dept = document.getElementById('tn_dept_header').value;
  const row = document.createElement('div');
  row.className = 'tn-peserta-row';
  row.innerHTML = `<select class="tn-peserta-select">${buildPesertaOptions(dept)}</select><button class="tn-peserta-remove" onclick="this.parentElement.remove()" title="Hapus">✕</button>`;
  container.appendChild(row);
}

function clampScore(el) {
  const v = parseInt(el.value);
  if (v > 4) el.value = 4;
  if (v < 1 && el.value !== '') el.value = 1;
}

function tnCalcScore(idx) {
  const entry = document.getElementById(`tn-entry-${idx}`);
  if (!entry) return;
  const sum = (cls) => [...entry.querySelectorAll(`.${cls}`)].reduce((a, el) => a + (parseInt(el.value) || 0), 0);
  const pa = sum('sc-pa'), ph = sum('sc-ph'), ma = sum('sc-ma'), mh = sum('sc-mh');
  document.getElementById(`sc_pa_total_${idx}`).textContent = pa;
  document.getElementById(`sc_ph_total_${idx}`).textContent = ph;
  document.getElementById(`sc_ma_total_${idx}`).textContent = ma;
  document.getElementById(`sc_mh_total_${idx}`).textContent = mh;
  const gt = pa + ph + ma + mh;
  document.getElementById(`sc_gt_${idx}`).textContent = gt;
  const statusEl = document.getElementById(`sc_gt_status_${idx}`);
  if (gt > 0) {
    statusEl.textContent = gt >= 32 ? `GT = ${gt} → Diterima ✅` : `GT = ${gt} → Ditolak ❌`;
    statusEl.className = 'tn-gt-result ' + (gt >= 32 ? 'accepted' : 'refused');
  } else { statusEl.textContent = ''; }
}

function tnFormatCost(el) {
  let v = el.value.replace(/\D/g, '');
  if (v) el.value = Number(v).toLocaleString('id-ID');
  else el.value = '';
}

function tnParseCost(str) {
  return parseInt((str || '0').replace(/\D/g, '')) || 0;
}

function tnReset() {
  if (!confirm('Reset semua form? Data yang belum di-submit akan hilang.')) return;
  tnCounter = 0;
  document.getElementById('tnEntries').innerHTML = '';
  document.getElementById('tn_submitter').value = '';
  document.getElementById('tn_dept_header').value = '';
  tnAddEntry();
}

async function tnSubmit() {
  const dept = document.getElementById('tn_dept_header').value.trim();
  if (!dept) { showToast('Departemen wajib dipilih', false); document.getElementById('tn_dept_header').focus(); return; }

  const entries = document.getElementById('tnEntries').children;
  const year = document.getElementById('tn_year').value;
  const submitter = document.getElementById('tn_submitter').value.trim();
  const items = [];
  const errors = [];

  for (const entry of entries) {
    const idx = entry.id.split('-').pop();
    const type = document.getElementById(`tn_type_${idx}`)?.value;
    const name = document.getElementById(`tn_name_${idx}`)?.value.trim();
    const org = document.getElementById(`tn_org_${idx}`)?.value;
    const target = document.getElementById(`tn_target_${idx}`)?.value;
    const cost = tnParseCost(document.getElementById(`tn_cost_${idx}`)?.value);

    const pesertaSelects = document.querySelectorAll(`#tn_peserta_${idx} .tn-peserta-select`);
    const participants = [...pesertaSelects].map(s => {
      const opt = s.options[s.selectedIndex];
      return opt && opt.value ? opt.text : null;
    }).filter(Boolean);

    const scoreSum = (cls) => [...entry.querySelectorAll(`.${cls}`)].reduce((a, el) => a + (parseInt(el.value) || 0), 0);
    const scores = {
      peserta_atasan: scoreSum('sc-pa'),
      peserta_hrd: scoreSum('sc-ph'),
      materi_atasan: scoreSum('sc-ma'),
      materi_hrd: scoreSum('sc-mh'),
    };

    if (!type) errors.push(`Kebutuhan #${idx}: Tipe wajib dipilih`);
    if (!name) errors.push(`Kebutuhan #${idx}: Nama Pelatihan wajib diisi`);
    if (!org) errors.push(`Kebutuhan #${idx}: Penyelenggara wajib dipilih`);
    if (!target) errors.push(`Kebutuhan #${idx}: Target Pelaksanaan wajib diisi`);
    if (!cost) errors.push(`Kebutuhan #${idx}: Estimasi Biaya wajib diisi`);
    if (!participants.length) errors.push(`Kebutuhan #${idx}: Minimal 1 peserta wajib dipilih`);

    items.push({
      department: dept, training_type: type, competency_desc: '',
      training_name: name, organizer: org,
      target_date: target ? target + '-01' : null,
      estimated_cost: cost, participants, plan_year: parseInt(year), scores,
    });
  }

  if (errors.length) { showToast(errors[0], false); return; }

  const btn = document.getElementById('tnSubmitBtn');
  btn.disabled = true; btn.textContent = '⏳ Menyimpan...';

  try {
    await api('/api/training-needs/batch', {
      method: 'POST',
      body: JSON.stringify({ items, submitted_by: submitter || null }),
    });
    showToast(`${items.length} kebutuhan pelatihan berhasil dikirim!`);
    tnCounter = 0;
    document.getElementById('tnEntries').innerHTML = '';
    document.getElementById('tn_dept_header').value = '';
    tnAddEntry();
  } catch (e) {
    showToast(e.message, false);
  } finally {
    btn.disabled = false; btn.textContent = '📤 Kirim Semua';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  SearchableSelect.initAll();
  initPage();
});
</script>
</body>
</html>
