name: Deploy to On-Premise Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd C:\www\ccsi-app
          git pull origin main

      - name: Install dependencies
        run: |
          cd C:\www\ccsi-app
          npm install --production

      - name: Restart app via PM2
        run: |
          pm2 restart ccsi-training
