name: Deploy to On-Premise Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted   # runner yang diinstall di server lokal

    steps:
      - name: Pull latest code
        run: |
          cd /var/www/ccsi-app   # sesuaikan dengan path di server Anda
          git pull origin main

      - name: Install dependencies
        run: |
          cd /var/www/ccsi-app
          npm install --production

      - name: Restart app via PM2
        run: |
          pm2 restart ccsi-training
