name: Auto-merge Claude Code PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'claude/')

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Syntax check (Node.js)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --production

      - name: Check JS syntax
        run: |
          find . -name "*.js" -not -path "./node_modules/*" | while read file; do
            node --check "$file" || exit 1
          done

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tunggu merge selesai lalu trigger deploy
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "Menunggu PR #$PR_NUMBER di-merge..."
          for i in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" --json state -q .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "PR merged. Trigger deploy ke server..."
              gh workflow run deploy.yml --ref main
              echo "Deploy berhasil di-trigger."
              exit 0
            fi
            echo "Status: $STATE (percobaan $i/30, tunggu 10 detik...)"
            sleep 10
          done
          echo "Timeout: PR belum merged setelah 5 menit."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
